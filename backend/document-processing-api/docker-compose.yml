version: '3.8'

services:
  postgres-primary:
    image: postgres:15
    container_name: postgres-dev
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d app"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-cluster:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  weaviate:
    image: semitechnologies/weaviate:1.24.1
    container_name: weaviate-dev
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
    volumes:
      - weaviate_data_dev:/var/lib/weaviate

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend/app:/usr/src/app/app
      - shared_uploads:/app/shared_uploads
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis-cluster:
        condition: service_healthy
      weaviate:
        condition: service_started

  worker-default:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: worker-default-dev
    command: celery -A app.celery_app.celery_app worker -l info -Q celery
    volumes:
      - ./backend/app:/usr/src/app/app
      - shared_uploads:/app/shared_uploads
    env_file:
      - .env
    depends_on:
      - redis-cluster
      - app

volumes:
  postgres_data_dev:
  weaviate_data_dev:
  shared_uploads:

version: '3.8'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx-prod
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./certbot/conf:/etc/letsencrypt
      # - ./certbot/www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app1
      - app2

  app1: &app_template
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app1-prod
    env_file: .env
    expose:
      - 8000
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  app2:
    <<: *app_template
    container_name: app2-prod

  worker-default: &worker_template
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: worker-default-prod
    command: celery -A app.celery_app.celery_app worker -l info -Q celery --concurrency=4
    env_file: .env
    depends_on:
      - redis-cluster
      - postgres-primary

  worker-high-priority:
    <<: *worker_template
    container_name: worker-high-priority-prod
    command: celery -A app.celery_app.celery_app worker -l info -Q high_priority --concurrency=2

  celery-beat:
    <<: *worker_template
    container_name: celery-beat-prod
    command: celery -A app.celery_app.celery_app beat -l info

  postgres-primary:
    image: postgres:15
    container_name: postgres-primary-prod
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    expose:
      - 5432

  # Read-only replica example
  postgres-replica:
    image: postgres:15
    container_name: postgres-replica-prod
    depends_on:
      - postgres-primary
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      # Add replication configuration here
    expose:
      - 5432

  redis-cluster:
    image: redis:7-alpine
    container_name: redis-cluster-prod
    command: redis-server --appendonly yes
    volumes:
      - redis_cluster_data:/data
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7-alpine
    container_name: redis-cache-prod
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  weaviate:
    image: semitechnologies/weaviate:1.24.1
    container_name: weaviate-prod
    volumes:
      - weaviate_data_prod:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: ''
      CLUSTER_HOSTNAME: 'node1'
    expose:
      - 8080

volumes:
  postgres_data_prod:
  weaviate_data_prod:
  redis_cluster_data:

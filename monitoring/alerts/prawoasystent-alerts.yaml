groups:
- name: prawoasystent.rules
  rules:
  - alert: HighErrorRate
    expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) / sum(rate(http_requests_total[5m])) > 0.05
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "High API Error Rate (instance {{ $labels.instance }})"
      description: "More than 5% of requests are failing with 5xx errors."

  - alert: HighResponseTime
    expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 2
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High API Response Time (instance {{ $labels.instance }})"
      description: "The 95th percentile response time is over 2 seconds."

  - alert: CeleryQueueBacklog
    expr: sum(celery_tasks_total{status="pending"}) > 100
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: "Celery queue has a large backlog"
      description: "More than 100 tasks are pending in Celery queues."

  - alert: AIServiceDown
    expr: up{job="ai-service"} == 0
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "AI service is down"
      description: "The primary AI service is not responding."

  API_V1_PREFIX: "/api/v1"
  LOG_LEVEL: "INFO"
  REDIS_URL: "redis://redis-service:6379/0"
  WEAVIATE_URL: "http://weaviate-service:8080"
  GOOGLE_CLOUD_PROJECT: "prawoasystent-prod"
  GOOGLE_CLOUD_STORAGE_BUCKET: "prawoasystent-documents-prod"

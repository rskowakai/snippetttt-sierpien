version: "3.9"

services:
  db:
    image: postgres:15
    container_name: prod_postgres_db
    env_file: .env
    volumes:
      - prod_db_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: prod_backend_app
    env_file: .env
    command: >
      sh -c "alembic upgrade head &&
             gunicorn app.main:app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 --workers=4"
    depends_on:
      - db
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: prod_frontend_app
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  prod_db_data:

networks:
  app-network:
    driver: bridge

version: "3.9"

services:
  db:
    image: postgres:15
    container_name: db_pisma
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_pisma
    restart: always
    env_file: .env
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: backend_pisma
    restart: always
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./backend:/app
    command: bash -c "alembic upgrade head && uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: frontend_pisma
    restart: always
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=${VITE_API_BASE}
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge

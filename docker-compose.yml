version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: prawoasystent-postgres
    environment:
      POSTGRES_USER: prawo_user
      POSTGRES_PASSWORD: prawo_password
      POSTGRES_DB: prawo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prawo_user -d prawo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prawoasystent-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
